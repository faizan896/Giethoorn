[package]
name = "giethoorn"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Replayable public market-data infrastructure for systematic trading research"
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
fs2 = "0.4"
native-tls = "0.2"
percent-encoding = "2.3"
rust_decimal = { version = "1.39", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tungstenite = { version = "0.28", features = ["native-tls"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
